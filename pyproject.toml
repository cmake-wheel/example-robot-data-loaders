[build-system]
build-backend = "cmeel"
requires = ["cmeel[build]", "example-robot-data == 5.0.0", "pin[build]"]

[project]
dependencies = ["example-robot-data == 5.0.0", "pin"]
description = "Set of robot URDFs for benchmarking and developed examples."
license = "BSD-3-Clause"
name = "example-robot-data-loaders"
version = "5.0.0"

[project.urls]
changelog = "https://github.com/Gepetto/example-robot-data/blob/devel/CHANGELOG.md"
homepage = "https://github.com/cmake-wheel/example-robot-data-loaders"
upstream = "https://github.com/gepetto/example-robot-data"

[tool.cmeel]
configure-args = [
  "-DBUILD_PYTHON_INTERFACE=ON",
  "-DBUILD_STANDALONE_PYTHON_INTERFACE=ON"
]
has-binaries = false
run-tests-after-install = true

[tool.ruff]
extend-exclude = ["cmake"]

[tool.ruff.lint]
extend-select = ["I", "NPY", "RUF", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["example_robot_data"]

[tool.tomlsort]
all = true
